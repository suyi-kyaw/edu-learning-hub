<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chinese Lessons &amp; HSK Courses - JiedeEdu Mandarin</title>
  <meta name="description" content="Explore structured Mandarin Chinese courses starting with HSK 2, featuring video lessons, exercises, stroke writing, and pronunciation practice.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Noto+Serif+SC:wght@600;700;900&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=excel11">
  <!-- Early dark theme application to avoid white-flash on reload -->
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem("linguapath_theme") || localStorage.getItem("theme");
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var activeTheme = (savedTheme === "dark" || savedTheme === "light") ? savedTheme : (prefersDark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", activeTheme);
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <!-- Shared Header Container -->
  <div id="sharedHeader"></div>

  <main>
    <!-- Hero Header -->
    <section class="hero" style="padding: 52px 0 36px; text-align: center;">
      <div class="container">
        <span class="eyebrow">Structured HSK Curriculum</span>
        <h1 style="font-size: clamp(2.2rem, 5vw, 3.2rem); font-weight: 900; margin: 10px 0 12px;">
          Chinese Lessons &amp; Courses
        </h1>
        <p style="max-width: 660px; margin: 0 auto; font-size: 1.05rem;">
          Select your course from the sidebar menu—explore <strong>HSK 2</strong> and practice with video lessons, interactive quizzes, stroke-order writing, and pronunciation checks.
        </p>
      </div>
    </section>

    <!-- 1. Course Sidebar + Lessons Grid View -->
    <section class="section" id="curriculumListSection" style="padding: 36px 0 80px;">
      <div class="container">
        <div class="lessons-layout">
          <!-- Left Course Menu Sidebar -->
          <aside class="lessons-sidebar" id="lessonsCourseSidebar" aria-label="Course Curriculum Navigation">
            <!-- Rendered dynamically by lessons.js (HSK 2 and custom courses) -->
          </aside>

          <!-- Main Course Stage -->
          <div class="lessons-main-stage">
            <!-- Active Course Banner Header + Unlock Full Course CTA -->
            <div id="activeCourseHeader" class="course-banner-card">
              <!-- Populated dynamically by lessons.js -->
            </div>

            <div class="lesson-grid" id="lessonsGrid">
              <!-- Lesson cards rendered dynamically from lessons.xlsx / D1 by lessons.js -->
            </div>

            <div style="display: flex; align-items: center; justify-content: flex-start; gap: 12px; flex-wrap: wrap; margin-top: 40px;">
              <a href="index.html#lessons" class="btn btn-secondary btn-lg">← Back to Home</a>
              <a href="games.html" class="btn btn-primary btn-lg">Practice with Games →</a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 2. Dedicated Lesson Workspace (4 Core Sections) -->
    <section class="lesson-workspace-container" id="lessonWorkspace">
      <div class="container">
        <!-- Hero Card populated by lessons.js -->
        <div id="workspaceHeroHeader" class="workspace-lesson-hero"></div>

        <!-- Workspace Section Tabs -->
        <div class="workspace-tabs-bar" role="tablist" aria-label="Lesson Workspace Sections">
          <button type="button" class="workspace-tab-btn active" data-tab="video" role="tab" aria-selected="true">
            📺 Video Lesson
          </button>
          <button type="button" class="workspace-tab-btn" data-tab="exercises" role="tab" aria-selected="false">
            ✏️ Practice Exercises
          </button>
          <button type="button" class="workspace-tab-btn" data-tab="writing" role="tab" aria-selected="false">
            🖌️ Writing &amp; Stroke Order
          </button>
          <button type="button" class="workspace-tab-btn" data-tab="pronunciation" role="tab" aria-selected="false">
            🎤 Pronunciation Check
          </button>
        </div>

        <!-- Section 1: Video Lesson Panel -->
        <div class="workspace-panel active" id="panel-video" role="tabpanel"></div>

        <!-- Section 2: Exercises Panel -->
        <div class="workspace-panel" id="panel-exercises" role="tabpanel"></div>

        <!-- Section 3: Writing Panel -->
        <div class="workspace-panel" id="panel-writing" role="tabpanel"></div>

        <!-- Section 4: Pronunciation Panel -->
        <div class="workspace-panel" id="panel-pronunciation" role="tabpanel"></div>
      </div>
    </section>
  </main>

  <!-- Shared Footer Container -->
  <div id="sharedFooter"></div>

  <!-- SheetJS with local fallback -->
  <script src="vendor/xlsx.full.min.js"></script>
  <script>
    if (typeof XLSX === "undefined") {
      document.write('<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"><\/script>');
    }
  </script>

  <!-- HanziWriter Stroke Order Engine -->
  <script src="vendor/hanzi-writer.min.js"></script>

  <!-- Pre-bundled Hanzi Stroke Vector Dictionary -->
  <script src="data/hanzi-data.js"></script>

  <!-- Audio Engine & iOS Safari Unlocker -->
  <script src="audio-engine.js"></script>

  <!-- Runtime Backend URL & Media Asset Resolver -->
  <script src="backend-config.js?v=excel11"></script>

  <!-- Excel Auth & Membership Client -->
  <script src="vendor/firebase-app.js?v=excel10"></script>
  <script src="auth-ui.js?v=excel7"></script>

  <!-- Dynamic Curriculum Controller -->
  <script src="lessons.js?v=excel11"></script>

  <!-- Shared Header Script -->
  <script src="header.js?v=excel7" defer></script>

  <!-- Shared Footer Script -->
  <script src="footer.js?v=excel7" defer></script>

</body>
</html>
