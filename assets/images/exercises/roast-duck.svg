<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <linearGradient id="duckBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="duckGlaze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="55%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <filter id="duckShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="400" height="280" rx="18" fill="url(#duckBgGrad)"/>
  <circle cx="58" cy="52" r="38" fill="#ffffff" fill-opacity="0.35"/>
  <circle cx="348" cy="228" r="50" fill="#ffffff" fill-opacity="0.22"/>

  <!-- Platter -->
  <g filter="url(#duckShadow)">
    <ellipse cx="200" cy="186" rx="132" ry="44" fill="#ffffff" stroke="#ea580c" stroke-width="4"/>
    <ellipse cx="200" cy="186" rx="112" ry="33" fill="#fffbeb" stroke="#fdba74" stroke-width="2"/>
  </g>

  <!-- Scallion & Cucumber garnishes -->
  <circle cx="110" cy="188" r="10" fill="#22c55e"/>
  <circle cx="122" cy="196" r="8" fill="#4ade80"/>
  <circle cx="288" cy="186" r="10" fill="#22c55e"/>
  <path d="M276 196 L300 184" stroke="#15803d" stroke-width="4" stroke-linecap="round"/>

  <!-- Peking Duck Body -->
  <g>
    <!-- Tail slices -->
    <path d="M126 164 L96 142 L114 134 Z" fill="#9a3412"/>
    <!-- Roasted Body -->
    <ellipse cx="195" cy="156" rx="68" ry="40" fill="url(#duckGlaze)" stroke="#7c2d12" stroke-width="3"/>
    <!-- Drumsticks -->
    <ellipse cx="152" cy="182" rx="22" ry="12" transform="rotate(-14 152 182)" fill="#9a3412" stroke="#7c2d12" stroke-width="2.5"/>
    <ellipse cx="230" cy="184" rx="20" ry="11" transform="rotate(14 230 184)" fill="#9a3412" stroke="#7c2d12" stroke-width="2.5"/>
    <!-- Crispy Wing -->
    <ellipse cx="194" cy="154" rx="34" ry="17" transform="rotate(-8 194 154)" fill="#b45309" stroke="#7c2d12" stroke-width="2.5"/>
    <!-- Duck Neck & Head -->
    <path d="M248 144 C264 130 274 108 264 94 C256 83 240 86 242 100 C244 114 238 128 232 136 Z" fill="url(#duckGlaze)" stroke="#7c2d12" stroke-width="2.5"/>
    <!-- Crisp Sheen Highlights -->
    <path d="M158 134 Q195 124 226 138" fill="none" stroke="#fde68a" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
    <path d="M170 146 Q198 140 218 148" fill="none" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
  </g>

  <!-- Mandarin Pancakes & Sauce Bowl -->
  <circle cx="96" cy="118" r="22" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <circle cx="96" cy="114" r="20" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
  <ellipse cx="308" cy="122" rx="24" ry="11" fill="#451a03" stroke="#9a3412" stroke-width="3"/>

  <!-- Chopsticks -->
  <g stroke="#9a3412" stroke-width="5" stroke-linecap="round">
    <line x1="258" y1="62" x2="344" y2="108"/>
    <line x1="248" y1="78" x2="336" y2="122"/>
  </g>
</svg>
